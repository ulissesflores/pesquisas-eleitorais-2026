name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: selo commitado confere
        run: python -I make_provenance.py --verify
      - name: replicação completa (resultados -> testes -> selo)
        run: python -I run_all.py
      - name: pytest
        run: pip install pytest && pytest -q
      - name: resultados recalculados (para diagnóstico se o selo divergir)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.python }}
          path: resultados/
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # o selo cobre o código; lint não reescreve arquivo selado
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
